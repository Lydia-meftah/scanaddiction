name: 🤖 Mise à jour catalogue

on:
  # Scraping nocturne des sites tiers DÉSACTIVÉ : le catalogue ne doit plus
  # être alimenté automatiquement par des sources non autorisées. Le code du
  # scraper est conservé (scraper.py) à des fins d'étude ; il reste lançable
  # manuellement via « Run workflow » si besoin.
  #   schedule:
  #     - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    name: Scraper les sites francophones
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🕷️ Run scraper
        run: python scraper.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: 📊 Vérification du JSON
        run: python check_catalogue.py

      - name: 💾 Commit & Push catalogue mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalogue-fr.json
          if git diff --staged --quiet; then
            echo "Aucun changement à committer."
          else
            COUNT=$(python -c "import json; print(json.load(open('data/catalogue-fr.json'))['total'])")
            git commit -m "🤖 Catalogue mis à jour — ${COUNT} œuvres [$(date +'%Y-%m-%d')]"
            git push
          fi
