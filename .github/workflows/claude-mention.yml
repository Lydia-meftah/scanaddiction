name: 💬 Claude — mention @claude

# Commenter « @claude … » dans un ticket ou une PR pour poser une question ou demander une retouche.
# Réservé aux personnes ayant les droits d'écriture sur le dépôt (vérifié par l'action).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Double verrou : le commentaire doit contenir @claude ET son auteur doit
    # avoir un lien de confiance avec le dépôt (propriétaire, membre ou
    # collaborateur). Sans ce filtre, n'importe quel visiteur pouvait démarrer
    # le job (qui dispose de contents:write et des secrets) et ne compter que
    # sur le contrôle interne de l'action. Defense-in-depth.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install pyyaml

      - name: Vérifier la clé Claude
        env:
          CLE_API: ${{ secrets.ANTHROPIC_API_KEY }}
          CLE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLE_API$CLE_OAUTH" ]; then
            echo "::error::Aucune clé Claude : ajouter le secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) ou ANTHROPIC_API_KEY dans Settings → Secrets and variables → Actions. Sans clé, l'agent ne fait rien."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: "agent/mention/"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(bash scripts/qualite.sh),Bash(npx:*),Bash(node:*),Bash(python3:*)"
