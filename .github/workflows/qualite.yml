name: ✅ Qualité

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer PyYAML
        run: pip install pyyaml

      - name: Contrôles (scripts/qualite.sh)
        run: bash scripts/qualite.sh
