<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue VF — ScanAddiction</title>
  <meta name="description" content="Catalogue agrégé de manhwa, webtoon et manga disponibles en français sur les sites scantrad francophones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/tracking.js"></script>
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:oklch(0.165 0.012 270);font-family:'Hanken Grotesk',system-ui,sans-serif;}
    ::selection{background:oklch(0.68 0.21 292);color:#15171d;}
    .sa-scroll::-webkit-scrollbar{height:6px;width:6px;}
    .sa-scroll::-webkit-scrollbar-thumb{background:oklch(0.34 0.014 270);border-radius:99px;}
    .sa-scroll::-webkit-scrollbar-track{background:transparent;}
    .sa-hidescroll::-webkit-scrollbar{display:none;}
    .sa-hidescroll{scrollbar-width:none;}
    @keyframes saPop{from{opacity:0;transform:translateY(-6px) scale(0.98);}to{opacity:1;transform:none;}}
    @keyframes saUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
    @keyframes saFloat{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-14px) rotate(-3deg);}}
    .sa-card{animation:saUp .4s cubic-bezier(.2,.7,.3,1) both;transition:border-color .2s,box-shadow .2s,transform .2s;}
    .sa-card:hover .sa-cover{transform:scale(1.04);}
    .sa-card:hover{border-color:oklch(0.6 0.2 292 / 0.7)!important;box-shadow:0 0 0 1px oklch(0.6 0.2 292 / 0.25),0 16px 40px -12px oklch(0.55 0.24 292 / 0.55);transform:translateY(-2px);}
    .sa-search:focus{border-color:oklch(0.62 0.2 292 / 0.8)!important;box-shadow:0 0 0 4px oklch(0.55 0.22 292 / 0.18),0 12px 40px -12px oklch(0.1 0.02 270 / 0.7)!important;}
    .sa-btn-primary{background:linear-gradient(135deg,oklch(0.68 0.21 292),oklch(0.58 0.22 258));box-shadow:0 8px 24px -8px oklch(0.55 0.24 285 / 0.6);}
    .sa-btn-primary:hover{filter:brightness(1.08);}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
    .sa-skeleton{background:linear-gradient(90deg,oklch(0.22 0.013 270) 25%,oklch(0.26 0.013 270) 50%,oklch(0.22 0.013 270) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;}
    .dropdown-menu{position:absolute;top:calc(100% + 8px);z-index:40;min-width:190px;background:oklch(0.22 0.013 270);border:1px solid oklch(0.34 0.014 270);border-radius:13px;padding:6px;box-shadow:0 20px 50px -16px oklch(0.05 0.02 270 / 0.9);animation:saPop .16s ease both;}
    .drop-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:oklch(0.82 0.012 270);font-family:'Hanken Grotesk';font-weight:500;font-size:13.5px;cursor:pointer;text-align:left;}
    .drop-opt:hover{background:oklch(0.28 0.014 270);}
  </style>
</head>
<body>

<div style="min-height:100vh;position:relative;background:radial-gradient(1200px 600px at 50% -200px,oklch(0.34 0.16 292 / 0.4),transparent 70%),radial-gradient(900px 500px at 100% 700px,oklch(0.32 0.15 264 / 0.22),transparent 70%),radial-gradient(800px 500px at -5% 900px,oklch(0.34 0.16 300 / 0.2),transparent 70%),oklch(0.15 0.018 270);color:oklch(0.97 0.004 270);overflow-x:hidden;">

  <!-- HEADER -->
  <header style="position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:oklch(0.165 0.012 270 / 0.82);border-bottom:1px solid oklch(0.28 0.014 270);">
    <div style="max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:32px;">
      <a href="/" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;">
        <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,oklch(0.68 0.21 292),oklch(0.56 0.22 264));display:flex;align-items:center;justify-content:center;font-size:19px;">🪼</div>
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:-0.01em;">Scan<span style="color:oklch(0.68 0.21 292);">Addiction</span></div>
      </a>
      <nav style="display:flex;gap:4px;margin-left:8px;">
        <a href="/catalogue-fr.html" style="padding:8px 14px;border-radius:8px;color:oklch(0.97 0.004 270);text-decoration:none;font-weight:600;font-size:14px;background:linear-gradient(135deg,oklch(0.32 0.14 292 / 0.55),oklch(0.28 0.12 264 / 0.4));border:1px solid oklch(0.45 0.16 292 / 0.4);">Catalogue</a>
        <a href="#" style="padding:8px 14px;border-radius:8px;color:oklch(0.66 0.012 270);text-decoration:none;font-weight:500;font-size:14px;">Populaire</a>
        <a href="#" style="padding:8px 14px;border-radius:8px;color:oklch(0.66 0.012 270);text-decoration:none;font-weight:500;font-size:14px;">Nouveautés</a>
      </nav>
      <div style="margin-left:auto;">
        <span id="meta-badge" style="font-size:12.5px;color:oklch(0.6 0.012 270);"></span>
      </div>
    </div>
  </header>

  <!-- HERO + SEARCH -->
  <section style="max-width:1280px;margin:0 auto;padding:54px 28px 30px;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:-10px;left:6%;font-size:46px;opacity:.16;transform:rotate(-8deg);animation:saFloat 7s ease-in-out infinite;pointer-events:none;">🪼</div>
    <div style="position:absolute;top:60px;right:8%;font-size:34px;opacity:.14;transform:rotate(10deg);animation:saFloat 8.5s ease-in-out infinite .8s;pointer-events:none;">🪼</div>
    <div style="position:absolute;bottom:-6px;left:18%;font-size:26px;opacity:.12;animation:saFloat 6.5s ease-in-out infinite 1.6s;pointer-events:none;">🪼</div>

    <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:oklch(0.3 0.13 292 / 0.5);border:1px solid oklch(0.42 0.15 285);font-size:12.5px;font-weight:600;color:oklch(0.82 0.11 292);margin-bottom:20px;">
      <span style="width:7px;height:7px;border-radius:50%;background:oklch(0.68 0.21 292);box-shadow:0 0 10px oklch(0.68 0.21 292);"></span>
      <span id="hero-count">…</span> scans · mis à jour chaque jour
    </div>

    <h1 style="font-family:'Space Grotesk';font-weight:700;font-size:clamp(34px,4.4vw,54px);line-height:1.04;letter-spacing:-0.025em;margin:0 0 14px;">Trouve ton prochain<br><span style="color:oklch(0.68 0.21 292);">scan</span> en quelques secondes.</h1>
    <p style="color:oklch(0.66 0.012 270);font-size:16px;max-width:520px;margin:0 auto 30px;">Cherche par titre, filtre par genre, source, statut ou note. Tout est là, clair et rapide.</p>

    <!-- SEARCH BAR -->
    <div style="max-width:680px;margin:0 auto;position:relative;">
      <div style="position:absolute;left:20px;top:50%;transform:translateY(-50%);color:oklch(0.6 0.012 270);pointer-events:none;font-size:20px;">⌕</div>
      <input id="search-input" class="sa-search" placeholder="Rechercher un manga, manhwa, webtoon…"
        style="width:100%;padding:18px 130px 18px 52px;border-radius:16px;border:1px solid oklch(0.34 0.03 280);background:oklch(0.2 0.02 275);color:oklch(0.97 0.004 270);font-family:'Hanken Grotesk';font-size:16.5px;outline:none;box-shadow:0 12px 40px -12px oklch(0.1 0.02 270 / 0.7);transition:border-color .2s,box-shadow .2s;" />
      <button id="clear-search" style="display:none;position:absolute;right:104px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:oklch(0.3 0.014 270);color:oklch(0.8 0.012 270);cursor:pointer;font-size:14px;line-height:1;">✕</button>
      <button class="sa-btn-primary" style="position:absolute;right:8px;top:8px;bottom:8px;padding:0 22px;border-radius:11px;border:none;color:#fff;font-family:'Hanken Grotesk';font-weight:700;font-size:15px;cursor:pointer;">Chercher</button>
    </div>

    <!-- GENRE CHIPS -->
    <div id="genre-chips" class="sa-scroll sa-hidescroll" style="display:flex;gap:9px;justify-content:flex-start;overflow-x:auto;padding:22px 2px 4px;max-width:760px;margin:0 auto;"></div>
  </section>

  <!-- TOOLBAR -->
  <section style="max-width:1280px;margin:0 auto;padding:8px 28px 0;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid oklch(0.26 0.014 270);">
      <span style="font-size:13px;font-weight:600;color:oklch(0.58 0.012 270);margin-right:2px;">Filtrer :</span>

      <div data-dropdown="source" style="position:relative;">
        <button id="btn-source" style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid oklch(0.32 0.014 270);background:oklch(0.21 0.012 270);color:oklch(0.92 0.004 270);font-family:'Hanken Grotesk';font-weight:600;font-size:13.5px;cursor:pointer;">
          <span style="opacity:.6;font-weight:500;">Source</span><span id="lbl-source">Toutes</span><span style="opacity:.5;font-size:10px;">▾</span>
        </button>
        <div id="menu-source" class="dropdown-menu" style="display:none;"></div>
      </div>

      <div data-dropdown="statut" style="position:relative;">
        <button id="btn-statut" style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid oklch(0.32 0.014 270);background:oklch(0.21 0.012 270);color:oklch(0.92 0.004 270);font-family:'Hanken Grotesk';font-weight:600;font-size:13.5px;cursor:pointer;">
          <span style="opacity:.6;font-weight:500;">Statut</span><span id="lbl-statut">Tous</span><span style="opacity:.5;font-size:10px;">▾</span>
        </button>
        <div id="menu-statut" class="dropdown-menu" style="display:none;">
          <button class="drop-opt" data-key="statut" data-val="Tous">Tous <span class="chk"></span></button>
          <button class="drop-opt" data-key="statut" data-val="en cours">En cours <span class="chk"></span></button>
          <button class="drop-opt" data-key="statut" data-val="terminé">Terminé <span class="chk"></span></button>
          <button class="drop-opt" data-key="statut" data-val="pause">En pause <span class="chk"></span></button>
        </div>
      </div>

      <div data-dropdown="type" style="position:relative;">
        <button id="btn-type" style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid oklch(0.32 0.014 270);background:oklch(0.21 0.012 270);color:oklch(0.92 0.004 270);font-family:'Hanken Grotesk';font-weight:600;font-size:13.5px;cursor:pointer;">
          <span style="opacity:.6;font-weight:500;">Type</span><span id="lbl-type">Tous</span><span style="opacity:.5;font-size:10px;">▾</span>
        </button>
        <div id="menu-type" class="dropdown-menu" style="display:none;">
          <button class="drop-opt" data-key="type" data-val="Tous">Tous <span class="chk"></span></button>
          <button class="drop-opt" data-key="type" data-val="manga">Manga <span class="chk"></span></button>
          <button class="drop-opt" data-key="type" data-val="manhwa">Manhwa <span class="chk"></span></button>
          <button class="drop-opt" data-key="type" data-val="manhua">Manhua <span class="chk"></span></button>
          <button class="drop-opt" data-key="type" data-val="webtoon">Webtoon <span class="chk"></span></button>
        </div>
      </div>

      <div data-dropdown="note" style="position:relative;">
        <button id="btn-note" style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid oklch(0.32 0.014 270);background:oklch(0.21 0.012 270);color:oklch(0.92 0.004 270);font-family:'Hanken Grotesk';font-weight:600;font-size:13.5px;cursor:pointer;">
          <span style="opacity:.6;font-weight:500;">Note</span><span id="lbl-note">Toutes</span><span style="opacity:.5;font-size:10px;">▾</span>
        </button>
        <div id="menu-note" class="dropdown-menu" style="display:none;">
          <button class="drop-opt" data-key="note" data-val="0">Toutes <span class="chk"></span></button>
          <button class="drop-opt" data-key="note" data-val="4">4.0+ <span class="chk"></span></button>
          <button class="drop-opt" data-key="note" data-val="4.5">4.5+ <span class="chk"></span></button>
          <button class="drop-opt" data-key="note" data-val="4.8">4.8+ <span class="chk"></span></button>
        </div>
      </div>

      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <span style="font-size:13.5px;color:oklch(0.62 0.012 270);"><b id="result-count" style="color:oklch(0.95 0.004 270);font-weight:700;">…</b> résultats</span>

        <div data-dropdown="sort" style="position:relative;">
          <button id="btn-sort" style="display:flex;align-items:center;ga
